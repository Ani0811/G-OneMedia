<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>G-One Media</title>
    <script type="text/javascript">
      // Forward visitors from GitHub Pages backup to primary Vercel site
      if (window.location.hostname === 'ani0811.github.io' && !window.location.search.includes('nobounce')) {
        var cleanPath = window.location.pathname.replace(/^\/G-OneMedia/, '');
        if (!cleanPath.startsWith('/')) cleanPath = '/' + cleanPath;
        window.location.replace('https://g-one-media.vercel.app' + cleanPath + window.location.search + window.location.hash);
      }

      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
